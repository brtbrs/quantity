services:
  quantity-api:
    container_name: quantity-api
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_TYPE: postgresql
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${API_PORT:-8000}:8000"
    command: ["python", "-m", "uvicorn", "data_service.web.api_server:APIServer().app", "--host", "0.0.0.0", "--port", "8000"]

  quantity-dashboard:
    container_name: quantity-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DB_TYPE: postgresql
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      API_BASE_URL: http://api:${API_PORT:-8000}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    command: ["python", "-m", "streamlit", "run", "data_service/dashboard/dashboard_app.py", "--server.port", "8501", "--server.address", "0.0.0.0", "--browser.gatherUsageStats", "false"]
    depends_on:
      quantity-api:
        condition: service_started
